<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Voting Pilkades — Login Administrator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!-- Navbar Minimalis -->
  <header class="navbar-minimal">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none">
        <span class="brand-mark"><i class="bi bi-check2-square"></i></span>
        <div>
          <span class="fw-bold text-dark d-block lh-1">E-Voting Pilkades</span>
          <small class="text-muted" style="font-size: 0.72rem;" data-nama-desa>Desa Sukamaju</small>
        </div>
      </a>

      <div class="d-flex align-items-center gap-2">
        <a href="index.html" class="nav-link-clean">Portal Pemilih</a>
        <a href="hasil.html" class="nav-link-clean">Hasil Sementara</a>
      </div>
    </div>
  </header>

  <!-- Form Login Admin -->
  <main class="container my-auto py-5 d-flex justify-content-center align-items-center">
    <div class="auth-card">
      <div class="accent-line"></div>
      <h4 class="fw-bold mb-1">Login Administrator</h4>
      <p class="text-muted small mb-4">Panel panitia pemilihan <span class="fw-semibold text-dark" data-nama-desa>Desa Sukamaju</span>.</p>

      <div id="adminAlert" class="alert d-none rounded-3 small py-2 mb-3" role="alert"></div>

      <form id="adminLoginForm">
        <div class="mb-3">
          <label for="username" class="form-label-clean">Username Panitia</label>
          <input type="text" class="form-control input-clean" id="username" placeholder="Masukkan username" required>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label-clean">Kata Sandi</label>
          <input type="password" class="form-control input-clean" id="password" placeholder="Masukkan kata sandi" required>
        </div>

        <button type="submit" class="btn btn-submit-clean w-100 mb-3" style="background-color: var(--navy);">
          Masuk ke Dashboard
        </button>
      </form>

      <!-- Info Akun Demo Admin -->
      <div class="demo-strip mt-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <span class="fw-semibold text-dark">Akun Demo Panitia</span>
          <button type="button" class="btn-fill-link" id="fillAdminDemo">Isi otomatis</button>
        </div>
        <div>Username: <span class="text-dark">admin</span> • Sandi: <span class="text-dark">123</span></div>
      </div>
    </div>
  </main>

  <!-- Footer Minimalis -->
  <footer class="footer-minimal py-3 mt-auto">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
      <span>© 2026 Panitia Pemilihan Kepala <strong class="text-dark fw-semibold" data-nama-desa>Desa Sukamaju</strong></span>
      <span>Panel Administrator</span>
    </div>
  </footer>

  <script src="assets/data.js"></script>
  <script>
    document.getElementById('fillAdminDemo').addEventListener('click', function() {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = '123';
    });

    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const userInput = document.getElementById('username').value.trim();
      const passInput = document.getElementById('password').value.trim();
      const alertBox = document.getElementById('adminAlert');

      const adminAccount = JSON.parse(localStorage.getItem('evoting_admin')) || { username: 'admin', password: '123' };

      if (userInput === adminAccount.username && passInput === adminAccount.password) {
        sessionStorage.setItem('admin_logged_in', 'true');
        window.location.href = 'admin-dashboard.html';
      } else {
        alertBox.className = 'alert alert-danger rounded-3 small py-2 mb-3';
        alertBox.textContent = 'Username atau kata sandi administrator salah.';
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>

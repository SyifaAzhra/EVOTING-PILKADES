<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Voting Pilkades — Masuk Pemilih</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!-- Navbar Minimalis -->
  <header class="navbar-minimal">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none">
        <span class="brand-mark"><i class="bi bi-check2-square"></i></span>
        <div>
          <span class="fw-bold text-dark d-block lh-1">E-Voting Pilkades</span>
          <small class="text-muted" style="font-size: 0.72rem;" data-nama-desa>Desa Sukamaju</small>
        </div>
      </a>

      <div class="d-flex align-items-center gap-2">
        <a href="hasil.html" class="nav-link-clean">Hasil Sementara</a>
        <a href="admin-login.html" class="btn-admin-minimal">Admin</a>
      </div>
    </div>
  </header>

  <!-- Konten Utama Tengah -->
  <main class="container my-auto py-5 d-flex justify-content-center align-items-center">
    <div class="auth-card">
      <div class="accent-line"></div>
      <h4 class="fw-bold mb-1">Masuk Pemilih</h4>
      <p class="text-muted small mb-4">Gunakan NIK dan kode akses warga <span class="fw-semibold text-dark" data-nama-desa>Desa Sukamaju</span> untuk memberikan suara.</p>

      <div id="loginAlert" class="alert d-none rounded-3 small py-2 mb-3" role="alert"></div>

      <form id="voterLoginForm">
        <div class="mb-3">
          <label for="nik" class="form-label-clean">Nomor Induk Kependudukan (NIK)</label>
          <input type="text" class="form-control input-clean" id="nik" placeholder="Contoh: 3578010101010001" maxlength="16" required>
        </div>

        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center">
            <label for="kodeAkses" class="form-label-clean">Kode Akses</label>
            <button type="button" class="btn-fill-link text-muted fw-normal" id="togglePassword">Lihat</button>
          </div>
          <input type="password" class="form-control input-clean" id="kodeAkses" placeholder="Masukkan kode akses" required>
        </div>

        <button type="submit" class="btn btn-submit-clean w-100 mb-3">
          Lanjutkan ke Pemilihan
        </button>
      </form>

      <!-- Info Akun Uji Coba -->
      <div class="demo-strip mt-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <span class="fw-semibold text-dark">Data Uji Coba</span>
          <button type="button" class="btn-fill-link" id="fillDemoBtn">Isi otomatis</button>
        </div>
        <div>NIK: <span class="text-dark">3578010101010001</span> • Kode: <span class="text-dark">SUKAMAJU01</span></div>
      </div>
    </div>
  </main>

  <!-- Footer Minimalis -->
  <footer class="footer-minimal py-3 mt-auto">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
      <span>© 2026 Panitia Pemilihan Kepala <strong class="text-dark fw-semibold" data-nama-desa>Desa Sukamaju</strong></span>
      <span>Satu Pemilih Satu Suara</span>
    </div>
  </footer>

  <script src="assets/data.js"></script>
  <script>
    // Toggle lihat/sembunyikan kode akses
    document.getElementById('togglePassword').addEventListener('click', function() {
      const input = document.getElementById('kodeAkses');
      if (input.type === 'password') {
        input.type = 'text';
        this.textContent = 'Sembunyikan';
      } else {
        input.type = 'password';
        this.textContent = 'Lihat';
      }
    });

    // Isi otomatis akun demo
    document.getElementById('fillDemoBtn').addEventListener('click', function() {
      document.getElementById('nik').value = '3578010101010001';
      document.getElementById('kodeAkses').value = 'SUKAMAJU01';
    });

    // Validasi Login Pemilih
    document.getElementById('voterLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const nikInput = document.getElementById('nik').value.trim();
      const kodeInput = document.getElementById('kodeAkses').value.trim();
      const alertBox = document.getElementById('loginAlert');

      const voters = JSON.parse(localStorage.getItem('evoting_voters')) || [];
      const voter = voters.find(v => v.nik === nikInput && v.kodeAkses === kodeInput);

      if (!voter) {
        alertBox.className = 'alert alert-danger rounded-3 small py-2 mb-3';
        alertBox.textContent = 'NIK atau Kode Akses tidak terdaftar.';
        alertBox.classList.remove('d-none');
        return;
      }

      if (voter.sudahMemilih) {
        alertBox.className = 'alert alert-warning rounded-3 small py-2 mb-3';
        alertBox.textContent = 'Anda sudah menggunakan hak suara. Mengalihkan ke hasil...';
        alertBox.classList.remove('d-none');
        setTimeout(() => {
          window.location.href = 'hasil.html';
        }, 1500);
        return;
      }

      sessionStorage.setItem('current_voter', JSON.stringify(voter));
      window.location.href = 'voting.html';
    });
  </script>
</body>
</html>
